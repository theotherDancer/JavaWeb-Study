<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生查询</title>
</head>


<body>
<h1>按学号查学生</h1>
<label for="studentId">学号</label>
<input id="studentId">
<button type="button" id="queryButton">查询</button>
<p id="queryResult">查询结果会显示在这里。</p>

<script>
    const studentIdInput = document.getElementById("studentId");
    const queryButton = document.getElementById("queryButton");
    const queryResult = document.getElementById("queryResult");


        // 点击时读取输入框当前的值，再把它显示在页面上。
        queryButton.addEventListener("click",  async function () {
            const studentId = studentIdInput.value.trim();

            if (studentId === "") {
                queryResult.textContent = "请输入学号";
                return;
            }
            const queryUrl = "/students/" + studentId;
            const  response=await fetch(queryUrl);
            const result=await response.json();
            console.log(result);
            if(result.success) {
                queryResult.textContent = "姓名： " + result.data.name;
            }
            else{
                queryResult.textContent = result.message;
            }
        });

</script>
</body>
</html>
