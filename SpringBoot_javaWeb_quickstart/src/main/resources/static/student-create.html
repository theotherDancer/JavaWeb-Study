<label for="studentId">学号</label>
<input id="studentId" type="text">

<label for="studentName">姓名</label>
<input id="studentName" type="text">

<label for="studentAge">年龄</label>
<input id="studentAge" type="number">
<button id="createButton" type="button">新增</button>
<p id="createMessage"></p>

<script>
    const createButton = document.getElementById("createButton");
    const ageInput = document.getElementById("studentAge");
    const nameInput = document.getElementById("studentName");
    const idInput = document.getElementById("studentId");
    const createMessageElement = document.getElementById("createMessage");

    createButton.addEventListener("click", async function () {
        console.log("点了新增");

        const age = ageInput.value;
        if ( age=== "") {
            createMessageElement.textContent="请输入年龄："
            return;
        }
        const ageNumber=Number(age);

        const studentId=idInput.value.trim();
        if ( studentId=== "") {
            createMessageElement.textContent="请输入id："
            return;
        }
        const studentName=nameInput.value.trim();
        if ( studentName=== "") {
            createMessageElement.textContent="请输入姓名："
            return;
        }
        //console.log(ageNumber, typeof ageNumber);
        //console.log(studentId, typeof studentId);
        //console.log(studentName, typeof studentName);
         const student={
            studentId:studentId,
            name:studentName,
            age:ageNumber
        };
        console.log(student);
        const bookText=JSON.stringify(student);
        const options={
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:bookText
        }
     //   const response=await fetch("/student",options);
        let response;

        try {
            // 把 await fetch(...) 的结果赋给 response
            // response=await fetch("/students",options);
            response = await fetch("/students", options);
        } catch (error) {
            // 用 textContent 显示「请求失败，请检查网络连接」
            createMessageElement.textContent="请求失败，请检查网络连接~";
            return;
        }
            console.log(response.status);

        if (!response.ok){
            createMessageElement.textContent="请求失败，状态码："+response.status;
            return;
        }

        let createResult;
        try{
            createResult = await response.json();
            }
        catch(error){
            //createMessageElement.textContent = createResult.message;
            //console.log(createResult);
            createMessageElement.textContent="无法读取服务器返回的结果";
            return;
        }
        createMessageElement.textContent = createResult.message;
        console.log(createResult);
    });
</script>
</body>
</html>
